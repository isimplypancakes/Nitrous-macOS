name: Nitrous
options:
  bundleIdPrefix: com.example
  createIntermediateGroups: true
schemes:
  Nitrous:
    build:
      targets:
        Nitrous: all
    run:
      config: Debug
    archive:
      config: Release
targets:
  Nitrous:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - Nitrous
    info:
      path: Nitrous/Info.plist
      properties:
        CFBundleDisplayName: Nitrous
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSApplicationCategoryType: public.app-category.social-networking
        NSPrincipalClass: NSApplication
        NSHighResolutionCapable: true
    settings:
      base:
        PRODUCT_NAME: Nitrous
        PRODUCT_BUNDLE_IDENTIFIER: com.example.nitrous.mac
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        # Set DEVELOPMENT_TEAM to your own Apple Developer team ID, or
        # configure signing in Xcode after generating the project.
        DEVELOPMENT_TEAM: ""
        SKIP_INSTALL: NO