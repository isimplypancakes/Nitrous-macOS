name: Nitrous
options:
  bundleIdPrefix: com.example
  createIntermediateGroups: true
schemes:
  Nitrous:
    build:
      targets:
        Nitrous: all
    run:
      config: Debug
    archive:
      config: Release
targets:
  Nitrous:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Nitrous
    info:
      path: Nitrous/Info.plist
      properties:
        CFBundleDisplayName: Nitrous
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        NSPhotoLibraryUsageDescription: "Attach images to your messages."
        NSCameraUsageDescription: "Capture photos to send in chat."
    settings:
      base:
        PRODUCT_NAME: Nitrous
        PRODUCT_BUNDLE_IDENTIFIER: com.example.nitrous
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "14"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        # Set DEVELOPMENT_TEAM to your own Apple Developer team ID, or
        # configure signing in Xcode after generating the project.
        DEVELOPMENT_TEAM: ""
        SKIP_INSTALL: NO
